name: Feature request
description: Suggest a new capability or a change to existing behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like Thumbly to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered or use now.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      description: Changes to the owner trust boundary need a design discussion first (see CONTRIBUTING.md).
      options:
        - label: This proposal keeps owner binding, approval of clients, control leases, and explicit pairing.
