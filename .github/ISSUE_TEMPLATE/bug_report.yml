name: Bug report
description: Something in Thumbly, the dashboard, or the SDK does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, device identifiers (UDID, serial number), screenshots of
        private data, or typed content. Report security problems privately through the
        [security policy](https://github.com/timurcatakli/thumbly/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Thumbly release
      description: The installed release, or the commit if you run from source.
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: MacBook Air M2, macOS 15.1
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 13, iOS 27.0.1
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Phone connection
      options:
        - USB
        - Wi-Fi
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Lines from `~/Library/Logs/Thumbly/thumbly.log` around the problem, and the output of
        `thumbly agent status`. Remove private data first.
      render: text
